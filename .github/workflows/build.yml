# .github/workflows/build.yml

# Build + push the three service Docker images to ghcr.io on every
# merge to main + on manual workflow_dispatch. Three parallel matrix
# jobs (one per service) so failures isolate per-image and the slow
# tf-svc build does not block the faster sklearn-svc and pt-svc.

# Images land at:
#   ghcr.io/<owner>/<repo>/<service>:latest        (rolling; main only)
#   ghcr.io/<owner>/<repo>/<service>:sha-<short>   (immutable per-commit)

# Authentication uses the workflow-scoped GITHUB_TOKEN; no PAT secrets
# needed for ghcr.io pushes from the owning repo.

name: Build and Push

on:
  # Build + push on merge to main. Pull requests deliberately do NOT
  # trigger this workflow - we never want to publish images for code
  # that has not landed on main.
  push:
    branches: [main]
  # Manual trigger for ad-hoc rebuilds (base-image security update,
  # registry-cleanup recovery, etc.).
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'manual rebuild'

# Workflow-level permissions. contents: read is for checkout; packages:
# write is required for pushing images to ghcr.io under the owning
# user/org's namespace. We do not need write access to repo contents
# here - the workflow only consumes the tree, never modifies it.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false means a failure in one service's build does
      # not cancel the other two. Each image's success/failure reports
      # independently in the Actions UI.
      fail-fast: false
      matrix:
        service: [sklearn-svc, pt-svc, tf-svc]

    steps:
      # Pull the repo into the runner's $GITHUB_WORKSPACE.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Docker Buildx as the default builder. Required for the
      # GitHub-Actions-backed layer cache (type=gha) used by build-push-action
      # below, plus multi-platform builds if added later.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to ghcr.io using the workflow-scoped GITHUB_TOKEN.
      # The token is auto-injected by Actions; no secret to configure in
      # repo settings. github.actor is the username that triggered the
      # workflow (push author or dispatch user).
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags + OCI labels from the git event. metadata-action
      # auto-lowercases the image path (ghcr.io requires lowercase, but
      # github.repository preserves the repo's display case), and produces:
      #   type=raw,value=latest   only when on the default branch (main)
      #   type=sha,format=short   always (yields sha-<7-char> per commit)
      # Plus standard OCI labels (org.opencontainers.image.*) on the image.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build + push the image in a single step. cache-from / cache-to
      # type=gha stores buildx's layer cache in GitHub's Actions cache
      # (10 GB free per repo); scope=<service> partitions caches so the
      # three services do not collide on the same cache keys. mode=max
      # stores intermediate layers in addition to the final image, so
      # subsequent runs hit the cache even when only late layers (app
      # code copy) change.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deployment/services/${{ matrix.service }}
          file: ./deployment/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Echo the pushed tags + manifest digest into the runner log for
      # quick reference. The digest is the OCI image manifest sha256 -
      # the immutable identifier for the exact bytes that were pushed,
      # independent of the human-readable tag.
      - name: Image summary
        run: |
          echo "Pushed ${{ matrix.service }} image:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Manifest digest: ${{ steps.build.outputs.digest }}"
