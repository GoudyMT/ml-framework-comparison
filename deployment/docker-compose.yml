# docker-compose.yml - Deployment Phase
#
# Multi-service orchestration. Each service in the `services:` block
# runs as its own container:
#   - sklearn-svc: PCA endpoint (/predict/pca)
#   - pt-svc:      PyTorch endpoints (/predict/dnn, /predict/gan/sample,
#                  /predict/qlearning/taxi)
#   - tf-svc:      TensorFlow endpoint (/translate)
#
# Networking, volume mounts, and environment variables are finalized
# once each service has a Dockerfile.

version: "3.9"

services:
  # Service definitions go here once per-service Dockerfiles exist.
