# pt-svc/pyproject.toml
#
# This service hosts the PyTorch model endpoints: a DNN classifier,
# a DCGAN image generator, and a tabular Q-learning policy. PEP 518
# build config + PEP 621 project metadata + tool configs
# (ruff/mypy/pytest) all live here as the single source of truth -
# pip-tools generates the lock files (requirements*.txt) from this
# manifest.

[project]
name = "pt-svc"
version = "0.1.0"
description = "FastAPI service for PyTorch deployments: DNN classifier, DCGAN image generator, tabular Q-learning policy"
requires-python = "==3.12.2"

# RUNTIME dependencies - what the service needs to RUN in production.
# The web/observability stack (FastAPI/Pydantic/structlog/prometheus)
# is framework-agnostic. The PyTorch-specific deps:
#   - torch: the model runtime that load_state_dict + forward run on
#   - scikit-learn: REQUIRED at unpickle time because the bundled
#     scaler.pkl is a real fitted StandardScaler instance. joblib.load
#     needs sklearn importable to reconstruct the class. (If the
#     scaler had been serialized as a plain dict of arrays, sklearn
#     wouldn't be required - but for a fitted estimator, it is.)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",

    # PyTorch CPU-only runtime. The "+cpu" local version identifier
    # (PEP 440) is critical: it locks us to the explicit CPU build
    # rather than letting pip choose. PyPI's `torch==2.5.1` is CPU on
    # Windows but CUDA on Linux - so without "+cpu" the lock file
    # would resolve to different wheels per platform, breaking
    # reproducibility once we containerize on Linux.
    
    # The "+cpu" wheels live at https://download.pytorch.org/whl/cpu
    # (NOT PyPI). pip-compile needs to know about that index:
    #   pip-compile --extra-index-url https://download.pytorch.org/whl/cpu ...
    # The resulting requirements.txt embeds that --extra-index-url
    # directive so subsequent installs resolve from the same source.
    
    # Why CPU: inference at 0.4 us/sample on the modeling phase makes
    # CPU more than fast enough. CUDA wheels are ~10x larger (~2 GB
    # vs ~200 MB) and require GPU drivers on the deployment host. CPU
    # keeps the container portable.
    "torch==2.5.1+cpu",

    # scikit-learn - REQUIRED for unpickling pt-dnn's scaler.pkl, which
    # is a fitted StandardScaler instance. Pinned to 1.8.0 to match the
    # version that fit the scaler (mismatched sklearn versions trigger
    # InconsistentVersionWarning at unpickle time).
    "scikit-learn==1.8.0",

    # joblib - StandardScaler is serialized via joblib in the modeling
    # phase. PyTorch state_dicts use torch.load (also pickle-based but
    # via PyTorch's own serializer, NOT joblib).
    "joblib>=1.4",

    # MLflow - registry client;
    "mlflow>=3.10",

    # NumPy - numerical arrays. PyTorch tensors interop with numpy via
    # torch.from_numpy() / tensor.numpy().
    "numpy>=1.26",

    # Structlog + prometheus_client
    # Framework-agnostic observability.
    "structlog>=24.0",
    "prometheus-client>=0.20",

    # Pillow (PIL) - directly imported by app/routers/gan.py to convert
    # the DCGAN generator's output tensors into PNG bytes for the
    # /predict/gan/sample response. Specifically:
    #   PIL.Image.fromarray(uint8_HWC_array, mode="RGB") -> Image
    #   Image.save(BytesIO(), format="PNG")              -> PNG bytes
    # The PNG bytes are then base64-encoded into the JSON response
    # per app/schemas/gan.py's GANResponse contract.
    
    # Why declare directly: Pillow is currently in the venv as a
    # transitive dep (mlflow -> matplotlib -> Pillow). Relying on the
    # transitive chain would silently break if a future mlflow release
    # drops matplotlib. Declaring it here makes pt-svc's actual
    # consumption explicit and decouples our runtime from mlflow's
    # internal dependency choices.
    
    # Lower bound 11.0: Pillow 11 (Oct 2024) is the first release with
    # AVIF-via-libaom support, dropped Python 3.8 support, and is on
    # the maintained track. >=11.0 excludes long-EOL versions while
    # leaving room for future minor bumps without pyproject churn.
    "pillow>=11.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]


[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where   = ["."]
include = ["app*"]
exclude = ["tests*"]


# Linter + formatter

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]


# Static type checker

[tool.mypy]
python_version       = "3.12"
strict               = true
warn_unused_ignores  = true
ignore_missing_imports = true


# Test runner

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
